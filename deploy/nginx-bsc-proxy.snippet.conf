# /etc/nginx/snippets/bsc-proxy.conf — shared proxy headers for bsc.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $bsc_client_ip;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Real-IP         $bsc_client_ip;
# Never let a client smuggle the header the daemon trusts.
proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
proxy_read_timeout 90s;
proxy_buffering off;
