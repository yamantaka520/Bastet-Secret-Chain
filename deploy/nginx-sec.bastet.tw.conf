# Bastet Secret Chain behind nginx on the same host, TLS terminated here with
# the existing *.bastet.tw certificate. Cloudflare (tunnel) is in front, so the
# real client is CF-Connecting-IP; nginx forwards it as X-Forwarded-For, which
# the daemon trusts only because --public-origin is set and the only peer that
# can reach 127.0.0.1:8790 is this nginx.

map $http_cf_connecting_ip $bsc_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
# Defense in depth for the unseal endpoint, in addition to the daemon's own
# 5-per-10-minutes throttle.
limit_req_zone $bsc_client_ip zone=bsc_login:1m rate=6r/m;
limit_req_zone $bsc_client_ip zone=bsc_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name sec.bastet.tw;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sec.bastet.tw;

    ssl_certificate     /etc/letsencrypt/live/bastet.tw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bastet.tw/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bastet.tw/chain.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The daemon sets its own CSP / frame / referrer headers on the document.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 8m;
    access_log /var/log/nginx/sec.bastet.tw.access.log;
    error_log  /var/log/nginx/sec.bastet.tw.error.log;

    location = /v1/vault/unseal {
        limit_req zone=bsc_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/snippets/bsc-proxy.conf;
    }

    location /v1/ {
        limit_req zone=bsc_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/snippets/bsc-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        include /etc/nginx/snippets/bsc-proxy.conf;
    }
}
