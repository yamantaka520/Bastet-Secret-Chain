# /etc/systemd/system/bsc.service.d/unattended.conf
#
# Opt-in unattended unseal for a server. The passphrase is stored as a systemd
# encrypted credential — sealed to this host's TPM2 when present, otherwise to
# /var/lib/systemd/credential.secret (root-only) — and handed to the daemon
# only at start, as a file under $CREDENTIALS_DIRECTORY that no other unit
# can see. Create it once, typing the passphrase yourself:
#
#   sudo mkdir -p /etc/bsc && sudo chmod 0700 /etc/bsc
#   read -rs PW && printf '%s' "$PW" | sudo systemd-creds encrypt --name=bsc-passphrase - /etc/bsc/passphrase.cred; unset PW
#   sudo systemctl daemon-reload && sudo systemctl restart bsc && sudo systemctl status bsc --no-pager
#
# Trade: anyone with root on this host can decrypt the credential, so the
# vault is now exactly as private as the host. That is the same trust every
# auto-starting server service makes; the ledger records each such unseal as
# `unseal_unattended` with source `systemd-credential`.
[Service]
LoadCredentialEncrypted=bsc-passphrase:/etc/bsc/passphrase.cred
ExecStart=
ExecStart=/usr/local/bin/bsc serve --vault /var/lib/bsc/vault.bsc --bind 127.0.0.1:8790 --public-origin https://sec.bastet.tw --unseal-credential bsc-passphrase
