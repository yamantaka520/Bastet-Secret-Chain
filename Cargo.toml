[workspace]
resolver = "2"
members = ["crates/bsc-crypto", "crates/bsc-store", "crates/bsc-daemon", "crates/bsc-mcp", "crates/bsc"]
# The fuzz crate needs a nightly toolchain and libFuzzer; keep it out of the
# ordinary `cargo test --workspace` build. See fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yamantaka520/Bastet-Secret-Chain"
rust-version = "1.82"

[workspace.dependencies]
# The crates in this workspace, by path *and* version: the version is what
# makes them publishable and what stops `cargo deny` counting an internal
# dependency as an unpinned one. Bump these with `workspace.package.version`.
bsc-crypto = { path = "crates/bsc-crypto", version = "0.2.0" }
bsc-store = { path = "crates/bsc-store", version = "0.2.0" }
bsc-daemon = { path = "crates/bsc-daemon", version = "0.2.0" }
bsc-mcp = { path = "crates/bsc-mcp", version = "0.2.0" }

argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
chacha20poly1305 = "0.10"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
mime_guess = "2"
hmac = "0.12"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rpassword = "7"
rust-embed = { version = "8", features = ["include-exclude"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "sync", "time", "signal"] }
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
