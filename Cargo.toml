[workspace]
resolver = "2"
members = ["crates/bsc-crypto", "crates/bsc-store"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yamantaka520/Bastet-Secret-Chain"
rust-version = "1.82"

[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
proptest = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
