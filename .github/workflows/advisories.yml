name: Advisories

# A credential vault should learn about a vulnerable dependency on the day it
# is published, not on the day someone next opens a pull request.
on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:

jobs:
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
